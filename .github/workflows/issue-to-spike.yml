# AI spike: issue (a game idea) -> one Sonnet session -> playable game pushed to
# `spike/issue-N`, and merged into the `dev` sandbox branch (never into `main`,
# constitution Principle I). No spec, no review, no PR. Starts when someone with
# triage rights adds the `ai-spike` label; when a run ends it starts the oldest
# `ai-spike-queue` issue. See docs/sdd/ci.md#ai-spike-issue-to-spike.
#
# Two jobs: `build` runs Claude and the code it writes and never sees a write
# token; `publish` holds AI_BOT_TOKEN, runs no repo code changed by Claude, and
# treats everything `build` hands over (bundles, files, outputs) as untrusted data.
name: issue-to-spike

on:
  issues:
    types: [labeled]

permissions:
  contents: read

# One spike at a time across the repo, so a batch does not hit the usage limit
# in parallel. GitHub keeps only one pending run per group, hence the queue label.
concurrency:
  group: ai-spike
  cancel-in-progress: false

env:
  ISSUE: ${{ github.event.issue.number }}
  BRANCH: spike/issue-${{ github.event.issue.number }}
  SENDER: ${{ github.event.sender.login }}
  # From the label list in the event, never from the issue text. Only someone with triage rights can add the label.
  DEPS_APPROVED: ${{ contains(github.event.issue.labels.*.name, 'deps-approved') }}

jobs:
  build:
    if: github.event.label.name == 'ai-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only: code in this job can read any token the job holds (env, $GITHUB_ENV,
    # runner memory), so no write token is ever referenced here.
    permissions:
      contents: read
      issues: read
    outputs:
      name: ${{ steps.build.outputs.name }}
      gates: ${{ steps.gates.outputs.gates }}
      dev: ${{ steps.dev.outputs.ready }}
    env:
      MODEL: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # Claude's Bash must not be able to push
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code@2.1.318

      - name: Prepare (issue text, branch, dev)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AI="$RUNNER_TEMP/ai"
          echo "AI=$AI" >> "$GITHUB_ENV"
          mkdir -p "$AI"
          gh auth setup-git
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "::error::Branch $BRANCH already exists. Delete it to re-run."
            exit 1
          fi
          # Issue text goes to a file, never into a shell command (script injection).
          gh issue view "$ISSUE" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$AI/issue.md"
          git fetch -q origin dev
          git config user.name "gamehub-ai"
          git config user.email "gamehub-ai@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          rc=0
          .github/scripts/run-claude.sh spike "$AI/build.md" write \
            -p "Follow prompts/issue-to-spike/build@v1.md exactly. The issue (#$ISSUE) is in $AI/issue.md. Dependencies approved: $DEPS_APPROVED." \
            --model "$MODEL" --add-dir "$AI" --permission-mode acceptEdits --max-turns 80 \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*)" || rc=$?
          git add -A && git commit -q -m "chore: uncommitted spike output (#$ISSUE)" || true
          # Claude's last line names the game; only trust it if it is a kebab-case app folder.
          name=$(tail -n 1 "$AI/build.md" | sed -n 's/^DONE \([a-z0-9][a-z0-9-]*\)$/\1/p')
          [ -n "$name" ] && [ -d "apps/$name" ] || name=""
          echo "name=$name" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || { echo "::error::claude exited $rc"; exit "$rc"; }

      - name: Gates (reported, not blocking)
        id: gates
        if: steps.build.outputs.name != ''
        env:
          NAME: ${{ steps.build.outputs.name }}
        run: |
          if pnpm turbo run lint check-types test buildSdk --filter="$NAME" --continue > "$AI/gates.log" 2>&1
          then echo "gates=pass" >> "$GITHUB_OUTPUT"
          else echo "gates=fail" >> "$GITHUB_OUTPUT"; tail -n 60 "$AI/gates.log"; fi

      # All stories share one Storybook bundle, so a game that breaks it must not reach `dev`.
      # Merged here, pushed by `publish` after its guard.
      - name: Merge into dev (Storybook)
        id: dev
        if: steps.gates.outputs.gates == 'pass'
        env:
          NAME: ${{ steps.build.outputs.name }}
        run: |
          git checkout -q -B dev origin/dev
          if ! git merge --no-ff --no-commit "$BRANCH"; then
            # shortcut: only the lockfile may conflict (rebuilt below); upgrade if other files start to conflict
            [ "$(git diff --name-only --diff-filter=U)" = pnpm-lock.yaml ] || { git merge --abort; exit 1; }
          fi
          # Git merges the lockfile as text, even without a conflict, and can leave it broken
          # (ERR_PNPM_LOCKFILE_MISSING_DEPENDENCY, seen on spike 34): rebuild it from dev's copy.
          git checkout HEAD -- pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
          git add pnpm-lock.yaml
          git commit -q -m "spike: merge $NAME (#$ISSUE)"
          pnpm turbo run lint check-types build --filter=storybook > "$AI/storybook.log" 2>&1 \
            || { tail -n 60 "$AI/storybook.log"; exit 1; }
          git bundle create "$AI/dev.bundle" dev ^origin/dev
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Bundle the spike branch
        if: always() && env.BASE_SHA != ''
        run: |
          [ "$(git rev-list --count "$BASE_SHA..$BRANCH")" = 0 ] || git bundle create "$AI/spike.bundle" "$BRANCH" "^$BASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.AI != ''
        with:
          name: spike-issue-${{ github.event.issue.number }}
          path: |
            ${{ runner.temp }}/ai/spike.bundle
            ${{ runner.temp }}/ai/dev.bundle
            ${{ runner.temp }}/ai/build.md
            ${{ runner.temp }}/ai/usage.tsv
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GATES: ${{ needs.build.outputs.gates }}
    steps:
      # `main` as of the event, not anything `build` produced: the scripts run below are trusted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no artifact when `build` failed before Prepare
        with:
          name: spike-issue-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/ai
      - name: Read build outputs
        env:
          RAW_NAME: ${{ needs.build.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/ai"
          echo "AI=$RUNNER_TEMP/ai" >> "$GITHUB_ENV"
          # Outputs of `build` are untrusted: the name is used in paths, regexes and URLs.
          [[ "$RAW_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]] && echo "NAME=$RAW_NAME" >> "$GITHUB_ENV" || true

      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ secrets.AI_BOT_TOKEN }}
        run: |
          [ -f "$AI/spike.bundle" ] || exit 0 # no commits
          gh auth setup-git
          git fetch -q "$AI/spike.bundle" "$BRANCH:$BRANCH"
          for i in 1 2 3; do
            git push origin "$BRANCH:refs/heads/$BRANCH" && { echo "pushed=true" >> "$GITHUB_OUTPUT"; break; }
            [ "$i" = 3 ] && exit 1
            sleep $((i * 30))
          done

      # dev has no review, so the prompt's file rules are enforced here: the spike
      # changes only a new game's folder, its story and the lockfile; the merge commit
      # `build` made is a plain merge of it (lockfile aside); package.json is as
      # generated; the lockfile adds no third-party package. With the `deps-approved`
      # label on the issue, `dependencies`/`devDependencies` and the lockfile are free
      # to change (scripts and every other file rule still apply).
      - name: Guard and push dev
        id: dev
        if: env.NAME != '' && needs.build.outputs.dev == 'true' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_BOT_TOKEN }} # a push by this token starts deploy-storybook
        run: |
          fail() { echo "::error::dev guard: $1"; exit 1; }
          git fetch -q origin dev
          git fetch -q "$AI/dev.bundle" "dev:spike-dev" || fail "dev moved since the build; re-run the spike"
          [ "$(git rev-parse spike-dev^1)" = "$(git rev-parse origin/dev)" ] || fail "merge parent is not dev's tip"
          [ "$(git rev-parse spike-dev^2)" = "$(git rev-parse "$BRANCH")" ] || fail "merge does not merge $BRANCH"
          for rev in "$GITHUB_SHA" origin/dev; do
            ! git cat-file -e "$rev:apps/$NAME" 2>/dev/null || fail "apps/$NAME already exists"
          done
          # Against main (the spike's base), not dev: dev may lag main, and main's commits come along.
          other=$(git diff --name-only "$GITHUB_SHA" "$BRANCH" \
            | grep -vE "^(apps/$NAME/.*|apps/storybook/src/stories/$NAME\.stories\.tsx|pnpm-lock\.yaml)$" || true)
          [ -z "$other" ] || fail "spike changes files outside apps/$NAME and its story: $(echo $other)"
          tree=$(git merge-tree --write-tree origin/dev "$BRANCH" | head -n 1)
          other=$(git diff --name-only "$tree" spike-dev | grep -vx pnpm-lock.yaml || true)
          [ -z "$other" ] || fail "merge commit differs from a plain merge: $(echo $other)"
          # Same as the template except the name: no new dependency (unless approved), no new (lifecycle) script.
          node -e '
            const drop = process.env.DEPS_APPROVED === "true" ? ["name", "dependencies", "devDependencies"] : ["name"];
            const [a, b] = process.argv.slice(1).map((s) => { const p = JSON.parse(s); drop.forEach((k) => delete p[k]); return JSON.stringify(p); });
            if (a !== b) process.exit(1);' \
            "$(git show "spike-dev:apps/$NAME/package.json")" \
            "$(git show "$GITHUB_SHA:apps/scratch-card-example/package.json")" \
            || fail "apps/$NAME/package.json differs from the template beyond its name"
          # Only `importers:` may change: a new package would show in `packages:`/`snapshots:`.
          # shortcut: when main and dev differ in third-party packages, this fails until main is merged into dev.
          strip() { git show "$1:pnpm-lock.yaml" | awk '/^importers:/ { s = 1; next } /^[a-z]/ { s = 0 } !s'; }
          new=$(strip spike-dev)
          [ "$DEPS_APPROVED" = true ] || [ "$new" = "$(strip origin/dev)" ] || [ "$new" = "$(strip "$GITHUB_SHA")" ] \
            || fail "pnpm-lock.yaml adds or changes third-party packages (or main changed dependencies: merge main into dev)"
          git push origin "spike-dev:refs/heads/dev"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Usage summary
        if: always()
        run: |
          { echo "## Claude usage (spike, issue #$ISSUE)"; echo; .github/scripts/usage-table.sh; } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }} # posted by github-actions[bot], so the @mention notifies
          PUSHED: ${{ steps.push.outputs.pushed }}
          MERGED: ${{ steps.dev.outputs.merged }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$NAME" ] && [ "$PUSHED" = true ]; then
            if [ "$MERGED" = true ]; then
              site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/?path=/story/$NAME--default"
              where="Merged into \`dev\`; once Pages deploys (a few minutes) play it at $site"
            else
              where="Not merged into \`dev\` (gates: $GATES, or the merge, the Storybook build or the dev guard failed; see the run)."
            fi
            msg="@$SENDER Spike \`$NAME\` is on branch \`$BRANCH\` (gates: $GATES). $where
          Or locally: \`git fetch origin $BRANCH && git checkout $BRANCH && pnpm install && pnpm --filter $NAME dev\`
          Spikes never reach \`main\`: to keep the game, open an \`ai-build\` issue for it. Run: $run"
          else
            msg="@$SENDER Spike stopped: $(tail -n 1 "$AI/build.md" 2>/dev/null). Partial work (if any) is on \`$BRANCH\`. Run: $run"
            gh issue edit "$ISSUE" --add-label ai-needs-human || true
          fi
          { echo "$msg"; echo; echo "<details><summary>Token usage</summary>"; echo; .github/scripts/usage-table.sh; echo; echo "</details>"; } > "$AI/comment.md"
          gh issue comment "$ISSUE" --body-file "$AI/comment.md"
          gh issue edit "$ISSUE" --remove-label ai-spike || true

      # A label added with GITHUB_TOKEN starts no workflow, so the bot token moves it.
      - name: Start next queued spike
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AI_BOT_TOKEN }}
        run: |
          next=$(gh issue list --label ai-spike-queue --state open --json number --jq 'sort_by(.number) | .[0].number // empty')
          [ -z "$next" ] || gh issue edit "$next" --remove-label ai-spike-queue --add-label ai-spike

# AI pipeline: issue -> speckit (specify, plan, tasks, implement) -> review/fix
# loop (max 3 fixes) -> PR -> notify a human to merge. AI never merges
# (constitution Principle II). Starts only when someone with triage rights adds
# the `ai-build` label to an issue. See docs/sdd/ci.md#ai-pipeline-issue-to-pr.
name: issue-to-pr

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.label.name == 'ai-build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write # status comments and labels on the issue
    env:
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: ai/issue-${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
      MAX_FIX_ROUNDS: 1
      # Must match the `verify` job in pr.yml, or a PR that passes here fails CI.
      GATES: lint check-types test buildSdk
      # Sonnet everywhere: Opus on the spec phase was 58% of a run's cost (PR #31).
      # Kept as its own variable so the spec phase can go back to Opus alone.
      SPEC_MODEL: claude-sonnet-5-5
      CODE_MODEL: claude-sonnet-5-5
      REVIEW_MODEL: claude-sonnet-5-5
      # Same tools for build and fix. No `git push`, no network tools: the
      # workflow pushes, and Claude never sees a GitHub token.
      # Speckit skills run their scripts by path (`.specify/scripts/powershell/x.ps1 -Json`),
      # not via `pwsh`; without the path entries every script call was denied (issue #18).
      # The scripts are executable with a pwsh shebang. `node` already runs any
      # code, so these entries add no risk.
      WRITE_TOOLS: >-
        Skill,Read,Write,Edit,Glob,Grep,Bash(pwsh:*),Bash(pnpm:*),Bash(node:*),
        Bash(.specify/scripts/powershell/:*),Bash(./.specify/scripts/powershell/:*),
        Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # Claude's Bash must not be able to push
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exact version: CI tool, not a project dependency (no lockfile change).
      - run: npm install -g @anthropic-ai/claude-code@2.1.318

      - name: Prepare (issue text, branch, start comment)
        env:
          GH_TOKEN: ${{ secrets.AI_BOT_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          # runner.temp is not available in job-level env, so AI is set here.
          AI="$RUNNER_TEMP/ai"
          echo "AI=$AI" >> "$GITHUB_ENV"
          mkdir -p "$AI"
          gh auth setup-git
          # Re-running must not overwrite a branch a human may have edited.
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "::error::Branch $BRANCH already exists. Delete it (and close its PR) to re-run."
            exit 1
          fi
          # Issue text goes to a file, never into a shell command (script injection).
          gh issue view "$ISSUE" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$AI/issue.md"
          git config user.name "gamehub-ai"
          git config user.email "gamehub-ai@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          GH_TOKEN="$ACTIONS_TOKEN" gh issue comment "$ISSUE" \
            --body "AI pipeline started: speckit → code → review/fix (max $MAX_FIX_ROUNDS). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Build (spec phase on SPEC_MODEL, implement phase on CODE_MODEL)
        id: build
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # phase, model, max turns. Returns non-zero when Claude printed ABORT;
          # fails the step when Claude itself failed (usage limit, max turns, crash).
          run_phase() {
            rc=0
            .github/scripts/run-claude.sh "build-$1" "$AI/build.md" append \
              -p "Follow prompts/issue-to-pr/build@v3.md exactly, phase \`$1\` only. The issue (#$ISSUE) is in $AI/issue.md." \
              --model "$2" --add-dir "$AI" --permission-mode acceptEdits --max-turns "$3" \
              --allowedTools "$WRITE_TOOLS" || rc=$? # issue #18: a hidden exit code let a usage limit count as success
            git add -A && git commit -q -m "chore: uncommitted $1 output (#$ISSUE)" || true
            if [ "$rc" != 0 ]; then
              echo "::error::claude exited $rc in phase $1. Partial work is committed and kept in the artifact."
              exit "$rc"
            fi
            last=$(tail -n 1 "$AI/build.md")
            [ "${last#ABORT}" = "$last" ]
          }
          if ! run_phase spec "$SPEC_MODEL" 120 || ! run_phase implement "$CODE_MODEL" 200 \
            || [ "$(git rev-list --count "$BASE_SHA"..HEAD)" = 0 ]; then
            echo "aborted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review / fix loop
        id: loop
        if: steps.build.outputs.aborted != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          result=fail
          fixes=0
          while :; do
            if pnpm turbo run $GATES --continue > "$AI/gates.log" 2>&1; then gates=pass; else gates=fail; fi
            if [ "$gates" = fail ]; then
              # No AI review on red gates: the log already says what to fix.
              { echo "## Gates failed ($GATES): AI review skipped"; echo
                echo '```'; tail -n 60 "$AI/gates.log"; echo '```'; echo; echo "VERDICT: FAIL"; } > "$AI/review.md"
            else
              # Diff and commit list as files, so the reviewer reads them once
              # instead of exploring with git. Lockfile left out (huge, guard-deps covers it).
              git diff "$BASE_SHA" HEAD -- . ':!pnpm-lock.yaml' > "$AI/diff.patch"
              git log --reverse --format='%h %s' "$BASE_SHA"..HEAD > "$AI/commits.txt"
              # Read-only reviewer, a fresh session each round (it does not grade its own fix).
              .github/scripts/run-claude.sh "review-$fixes" "$AI/review.md" write \
                -p "Follow prompts/issue-to-pr/review@v3.md exactly. Issue: $AI/issue.md. Diff: $AI/diff.patch. Commits: $AI/commits.txt." \
                --model "$REVIEW_MODEL" --add-dir "$AI" --max-turns 40 \
                --allowedTools "Read,Glob,Grep" > /dev/null
            fi
            cat "$AI/review.md"
            if [ "$gates" = pass ] && [ "$(tail -n 1 "$AI/review.md")" = "VERDICT: PASS" ]; then result=pass; break; fi
            [ "$fixes" -lt "$MAX_FIX_ROUNDS" ] || break
            fixes=$((fixes + 1))
            rc=0
            .github/scripts/run-claude.sh "fix-$fixes" "$AI/fix.md" write \
              -p "Follow prompts/issue-to-pr/fix@v3.md exactly. Issue: $AI/issue.md. Review: $AI/review.md. Gates: $gates, log: $AI/gates.log. Round $fixes of $MAX_FIX_ROUNDS." \
              --model "$CODE_MODEL" --add-dir "$AI" --permission-mode acceptEdits --max-turns 120 \
              --allowedTools "$WRITE_TOOLS" || rc=$?
            git add -A && git commit -q -m "fix: review round $fixes (#$ISSUE)" || true
            [ "$rc" = 0 ] || { echo "::error::claude exited $rc in fix round $fixes."; exit "$rc"; }
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "fixes=$fixes" >> "$GITHUB_OUTPUT"

      # Only when gates and review pass: the spec then describes code that exists.
      # CLAUDE.md Rule 1: a Draft (0.x) becomes 1.0.0, approved when the owner
      # merges this PR; an already approved spec gets a PATCH bump (status only).
      - name: Mark spec Implemented
        if: steps.build.outputs.aborted != 'true' && steps.loop.outputs.result == 'pass'
        run: |
          dir=$(node -p 'require("./.specify/feature.json").feature_directory')
          spec="$dir/spec.md"
          v=$(sed -n 's/^\*\*Version\*\*: \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' "$spec")
          [ -n "$v" ] || { echo "::error file=$spec::no **Version**: x.y.z line"; exit 1; }
          IFS=. read -r major minor patch <<< "$v"
          if [ "$major" = 0 ]; then
            new=1.0.0 note="approved by the owner by merging the PR; Status → Implemented (issue #$ISSUE)"
          else
            new="$major.$minor.$((patch + 1))" note="Status → Implemented (issue #$ISSUE)"
          fi
          line="- $new ($(date -u +%F)): $note."
          sed -i "s/^\*\*Status\*\*: .*/**Status**: Implemented/; s/^\*\*Version\*\*: .*/**Version**: $new/" "$spec"
          # Newest first: insert above the first entry under ## Changelog (or append if none).
          awk -v line="$line" '/^## Changelog/ { c = 1 } c == 1 && /^- / { print line; c = 2 } { print } END { if (c == 1) print line }' \
            "$spec" > "$spec.tmp" && mv "$spec.tmp" "$spec"
          git add "$spec" && git commit -q -m "docs(spec): $(basename "$dir") $new, Status Implemented (#$ISSUE)"
          git show HEAD~1:"$spec" > "$AI/old-spec.md"
          node packages/spec-diff/src/cli.ts "$AI/old-spec.md" "$spec"

      - name: Push and open PR
        id: pr
        if: steps.build.outputs.aborted != 'true'
        env:
          # A PAT/App token, not GITHUB_TOKEN: a PR opened by GITHUB_TOKEN does
          # not trigger pr.yml, so the required checks would never run.
          GH_TOKEN: ${{ secrets.AI_BOT_TOKEN }}
          RESULT: ${{ steps.loop.outputs.result }}
          FIXES: ${{ steps.loop.outputs.fixes }}
        run: |
          # Retry: GitHub sometimes rejects with "fatal error in commit_refs" (issue #18).
          for i in 1 2 3; do
            git push origin "HEAD:refs/heads/$BRANCH" && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 30))
          done
          deps=false
          git diff --quiet "$BASE_SHA" HEAD -- pnpm-lock.yaml || deps=true
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          {
            echo "Closes #$ISSUE"
            echo
            echo "AI pipeline result: **$RESULT** after $FIXES fix round(s) (max $MAX_FIX_ROUNDS)."
            echo
            if [ "$deps" = true ]; then
              echo "## New dependencies: owner approval needed (Principle IV)"
              echo
              echo "Reasons are in \`plan.md\` under \`## New dependencies\`. Add the \`deps-approved\` label to approve; \`guard-deps\` blocks the merge until then."
              echo
              echo '```diff'
              git diff "$BASE_SHA" HEAD -- '*package.json' | grep -E '^[+-] ' || true
              echo '```'
              echo
            fi
            echo "## Token usage"
            echo
            .github/scripts/usage-table.sh
            echo
            echo "## Final review"
            echo
            cat "$AI/review.md"
            echo
            echo "_Generated by issue-to-pr. A human reviews spec + code and merges (constitution Principle II)._"
          } > "$AI/pr-body.md"
          draft=""
          [ "$RESULT" = pass ] || draft="--draft"
          url=$(gh pr create $draft --base main --head "$BRANCH" \
            --title "$(head -n 1 "$AI/issue.md" | sed 's/^# //') (#$ISSUE)" --body-file "$AI/pr-body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # On any failure after the branch was created, keep Claude's commits so a
      # human can push them instead of paying for a new run.
      - name: Bundle work on failure
        if: failure() && env.BASE_SHA != ''
        run: git bundle create "$AI/work.bundle" "$BASE_SHA..$BRANCH" || echo "No commits to keep."
      - name: Upload work on failure
        id: keep
        if: failure() && env.BASE_SHA != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-issue-${{ github.event.issue.number }}
          path: |
            ${{ runner.temp }}/ai/work.bundle
            ${{ runner.temp }}/ai/build.md
            ${{ runner.temp }}/ai/review.md
            ${{ runner.temp }}/ai/usage.tsv
          if-no-files-found: ignore
          retention-days: 7

      - name: Usage summary
        if: always() && env.AI != ''
        run: |
          { echo "## Claude usage (issue #$ISSUE)"; echo; .github/scripts/usage-table.sh; } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }} # posted by github-actions[bot], so the @mention notifies
          ABORTED: ${{ steps.build.outputs.aborted }}
          RESULT: ${{ steps.loop.outputs.result }}
          PR_URL: ${{ steps.pr.outputs.url }}
          DEPS: ${{ steps.pr.outputs.deps }}
          KEPT_URL: ${{ steps.keep.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$ABORTED" = true ]; then
            msg="@$SENDER AI pipeline stopped without a PR: $(tail -n 1 "$AI/build.md" 2>/dev/null). Run: $run"
            gh issue edit "$ISSUE" --add-label ai-needs-human || true
          elif [ "$JOB_STATUS" != success ] || [ -z "$PR_URL" ]; then
            msg="@$SENDER AI pipeline failed. Run: $run"
            limit=$(grep -h -m1 "hit your .*limit" "$AI"/*.md "$AI"/*.json 2>/dev/null | head -n 1)
            [ -n "$limit" ] && msg="$msg
          Stopped by the Claude usage limit: \"$limit\". Push the kept work (below) and finish it after the reset."
            [ -n "$KEPT_URL" ] && msg="$msg
          The work is kept in artifact $KEPT_URL (7 days). To push it: unzip, then
          \`git fetch work.bundle $BRANCH:$BRANCH && git push origin $BRANCH\` and open the PR."
            gh issue edit "$ISSUE" --add-label ai-needs-human || true
          elif [ "$RESULT" = pass ]; then
            msg="@$SENDER PR ready for your review and merge: $PR_URL"
          else
            msg="@$SENDER Review still fails after $MAX_FIX_ROUNDS fix rounds. Draft PR: $PR_URL (open findings in its description)."
            gh issue edit "$ISSUE" --add-label ai-needs-human || true
          fi
          [ "$DEPS" = true ] && msg="$msg It adds dependencies: check the reasons and add \`deps-approved\` to approve."
          gh issue comment "$ISSUE" --body "$msg"
          gh issue edit "$ISSUE" --remove-label ai-build || true
